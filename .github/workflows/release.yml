name: Release

# Push a tag like v0.2.0 to build the exe and publish a GitHub release.
on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: go test ./...
      - name: Build
        run: VERSION="${GITHUB_REF_NAME#v}" ./build.sh
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd dist
          sha256sum ClaudeTaskbarUsage.exe > ClaudeTaskbarUsage.exe.sha256
          gh release create "$GITHUB_REF_NAME" ClaudeTaskbarUsage.exe ClaudeTaskbarUsage.exe.sha256 \
            --title "$GITHUB_REF_NAME" --generate-notes
