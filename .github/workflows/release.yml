name: Release

# Push a tag like v0.2.0 (matching the version in Cargo.toml) to build the
# exe and publish a GitHub release.
on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Check tag matches Cargo.toml
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          test "v$version" = "$GITHUB_REF_NAME" || { echo "tag $GITHUB_REF_NAME != Cargo.toml version $version"; exit 1; }
      - run: sudo apt-get install -y -qq mingw-w64
      - run: rustup target add x86_64-pc-windows-gnu
      - run: cargo test
      - run: cargo build --release --target x86_64-pc-windows-gnu
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir dist && cp target/x86_64-pc-windows-gnu/release/ClaudeTaskbarUsage.exe dist/
          cd dist
          sha256sum ClaudeTaskbarUsage.exe > ClaudeTaskbarUsage.exe.sha256
          gh release create "$GITHUB_REF_NAME" ClaudeTaskbarUsage.exe ClaudeTaskbarUsage.exe.sha256 \
            --title "$GITHUB_REF_NAME" --generate-notes

  # Opens a pull request at microsoft/winget-pkgs for the new version, from
  # the fork rodrigohpalmeirim/winget-pkgs. WINGET_TOKEN is a classic PAT
  # with public_repo + workflow scopes. Pinned to a commit because the action
  # receives that token.
  winget:
    needs: release
    runs-on: ubuntu-latest
    steps:
      - uses: vedantmgoyal9/winget-releaser@f29ed1ffd34f91223a2aebaa71beaab0901ff9fd # v2
        with:
          identifier: RodrigoPalmeirim.ClaudeTaskbarUsage
          installers-regex: '\.exe$'
          token: ${{ secrets.WINGET_TOKEN }}
